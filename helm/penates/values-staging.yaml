# Staging values for Penates
# Use this for staging environment

nameOverride: "penates-staging"

# Production-like configuration
replicaCount: 1

# Use ClusterIP service type
service:
  type: ClusterIP

# Enable ingress with TLS
# Requires cert-manager or manual TLS certificate setup
# ingress:
#   enabled: true
#   className: "nginx"
#   annotations:
#     cert-manager.io/cluster-issuer: "letsencrypt-staging"
#     nginx.ingress.kubernetes.io/ssl-redirect: "true"
#     nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
#   hosts:
#     - host: staging.penates.yourdomain.com
#       paths:
#         - path: /
#           pathType: Prefix
#   tls:
#     - secretName: penates-staging-tls
#       hosts:
#         - staging.penates.yourdomain.com

# PostgreSQL configuration for staging
postgres:
  enabled: true
  auth:
    username: penates_staging
    password: "staging-db-password-change-me"
    database: penates_staging
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "standard"
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# Backend configuration for staging
backend:
  replicaCount: 1
  env:
    ENV: staging
    JWT_SECRET: "staging-secret-change-in-production"
    JWT_EXPIRY: "24h"
    CORS_ALLOWED_ORIGINS: "https://staging.penates.yourdomain.com"
    SEED_ADMIN_EMAIL: "admin@staging.penates.yourdomain.com"
    SEED_ADMIN_PASSWORD: "staging-admin-password-change-me"
    SEED_ADMIN_ORG: "Staging Organisation"
  persistence:
    size: 1Gi
    storageClass: "standard"
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

# Frontend configuration for staging
frontend:
  replicaCount: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# Monitoring enabled in staging
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Autoscaling disabled in staging (can be enabled if needed)
autoscaling:
  enabled: false
