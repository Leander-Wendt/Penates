apiVersion: v1
kind: Service
metadata:
  name: {{ include "penates.frontendServiceName" . }}
  labels:
    {{- include "penates.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: {{ .Values.service.frontend.targetPort }}
      name: {{ .Values.service.frontend.name }}
      protocol: TCP
  selector:
    {{- include "penates.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
