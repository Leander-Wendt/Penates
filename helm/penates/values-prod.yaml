# Production values for Penates
# Use this for production deployment

nameOverride: "penates-prod"

# Production configuration with redundancy
replicaCount: 2

# Use ClusterIP service type
service:
  type: ClusterIP

# Enable ingress with TLS for production
# Requires cert-manager or manual TLS certificate setup
# ingress:
#   enabled: true
#   className: "nginx"
#   annotations:
#     cert-manager.io/cluster-issuer: "letsencrypt-prod"
#     nginx.ingress.kubernetes.io/ssl-redirect: "true"
#     nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
#     nginx.ingress.kubernetes.io/proxy-buffering: "enabled"
#     nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
#   hosts:
#     - host: penates.yourdomain.com
#       paths:
#         - path: /
#           pathType: Prefix
#   tls:
#     - secretName: penates-prod-tls
#       hosts:
#         - penates.yourdomain.com

# PostgreSQL configuration for production
postgres:
  enabled: true
  auth:
    username: penates_prod
    password: "production-db-password-change-me"
    database: penates_prod
    existingSecret: "penates-postgres-secret"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "fast-ssd"
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 1000m
  config:
    sharedBuffers: "256MB"
    maxConnections: "200"

# Backend configuration for production
backend:
  replicaCount: 2
  env:
    ENV: production
    JWT_SECRET: "production-secret-must-be-long-and-random-change-me"
    JWT_EXPIRY: "12h"
    CORS_ALLOWED_ORIGINS: "https://penates.yourdomain.com"
    SEED_ADMIN_EMAIL: "admin@penates.yourdomain.com"
    SEED_ADMIN_PASSWORD: "production-admin-password-change-me"
    SEED_ADMIN_ORG: "Production Organisation"
    MAX_UPLOAD_SIZE_MB: "20"
    LOGIN_RATE_LIMIT_ATTEMPTS: "5"
    LOGIN_RATE_LIMIT_WINDOW: "5m"
  persistence:
    size: 5Gi
    storageClass: "fast-ssd"
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# Frontend configuration for production
frontend:
  replicaCount: 2
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

# Monitoring enabled in production
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 5s

# Autoscaling enabled in production
autoscaling:
  enabled: true
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70

# Network policy for production
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: ingress-nginx

# Pod disruption budget for high availability
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Security context for production
podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
